name: linkedin-post-alerts
x-log-driver: &log-driver
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
x-log-environment: &log-environment
  LOG_DIR: /app/logs
  LOG_MAX_BYTES: '5242880'
  LOG_BACKUPS: '3'
  LOG_RETENTION_DAYS: '7'
x-app: &app
  build: .
  user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
  logging: *log-driver
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &environment
    <<: *log-environment
    DATABASE_URL: postgres://alerts:alerts@postgres:5432/alerts
    SOURCE_MODE: mock
    TELEGRAM_MODE: dry-run
    PREFER_RUSSIAN: ${PREFER_RUSSIAN:-true}
    COLLECTION_PAUSED: ${COLLECTION_PAUSED:-false}
    FEED_POLL_INTERVAL_MS: ${FEED_POLL_INTERVAL_MS:-300000}
    POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-180000}
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:17-alpine
    logging: *log-driver
    restart: unless-stopped
    environment:
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: alerts
      POSTGRES_DB: alerts
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alerts -d alerts']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    logging: *log-driver
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    volumes: ['./.local/logs/migrate:/app/logs']
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      <<: *log-environment
      LOG_SERVICE: migrate
      DATABASE_URL: postgres://alerts:alerts@postgres:5432/alerts
    depends_on:
      postgres:
        condition: service_healthy
  collector:
    <<: *app
    environment:
      <<: *environment
      LOG_SERVICE: collector
    volumes: ['./.local/logs/collector:/app/logs']
    command: ['node', 'dist/services/collector/src/main.js']
    ports: ['127.0.0.1:3101:3101']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3101/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  ocr:
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    logging: *log-driver
    environment:
      <<: *log-environment
      LOG_SERVICE: ocr
    volumes: ['./.local/logs/ocr:/app/logs']
    build:
      context: .
      dockerfile: Dockerfile.ocr
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3104/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  processor:
    <<: *app
    volumes: ['./.local/logs/processor:/app/logs']
    command: ['node', 'dist/services/processor/src/main.js']
    environment:
      <<: *environment
      OCR_URL: http://ocr:3104
      LOG_SERVICE: processor
    depends_on:
      migrate:
        condition: service_completed_successfully
      ocr:
        condition: service_healthy
    ports: ['127.0.0.1:3102:3102']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3102/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  notifier:
    <<: *app
    environment:
      <<: *environment
      LOG_SERVICE: notifier
    volumes: ['./.local/logs/notifier:/app/logs']
    command: ['node', 'dist/services/notifier/src/main.js']
    ports: ['127.0.0.1:3103:3103']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3103/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  postgres-data:
