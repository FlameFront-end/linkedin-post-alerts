name: Feature request
description: Propose an improvement to discovery, matching or delivery.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Tradeoffs and alternatives
      description: Consider request budgets, privacy and account restrictions.
